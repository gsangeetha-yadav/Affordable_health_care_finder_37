<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    Affordable Healthcare Finder
  </title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:linear-gradient(to right,#dbeafe,#ffffff,#dcfce7);
    }

    nav{
      background:white;
      padding:20px;
      text-align:center;
      box-shadow:0 2px 10px gray;
      position:sticky;
      top:0;
    }

    nav h1{
      color:#2563eb;
    }

    .hero{
      text-align:center;
      padding:50px 20px;
    }

    .hero h2{
      color:#2563eb;
      font-size:45px;
    }

    .hero p{
      margin-top:15px;
      color:gray;
      font-size:20px;
    }

    input{
      width:300px;
      padding:12px;
      border-radius:10px;
      border:1px solid gray;
      margin-top:15px;
    }

    button{
      padding:12px 18px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      margin:10px;
      font-size:15px;
    }

    button:hover{
      background:#1d4ed8;
    }

    .cards{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:20px;
      padding:30px;
    }

    .card{
      width:360px;
      background:white;
      padding:20px;
      border-radius:20px;
      box-shadow:0 5px 10px gray;
    }

    .card h3{
      color:green;
      margin-bottom:10px;
    }

    .card p{
      margin-top:8px;
      line-height:1.5;
    }

    .emergency{
      background:red;
      color:white;
      text-align:center;
      padding:40px;
    }

    footer{
      background:#2563eb;
      color:white;
      text-align:center;
      padding:20px;
    }

  </style>

</head>

<body>

  <nav>

    <h1>
      🏥 Affordable Healthcare Finder
    </h1>

  </nav>

  <!-- HERO -->

  <section class="hero">

    <h2>
      Affordable Healthcare Finder 🩺
    </h2>

    <p>
      Search hospitals, CT Scan,
      MRI, emergency support and more.
    </p>

    <button onclick="findNearbyHospitals()">

      📍 Nearby Hospitals

    </button>

    <button onclick="voiceSupport()">

      🎤 Voice Guidance

    </button>

    <br>

    <input
      type="text"
      id="hospitalSearch"
      placeholder="Search Hospital">

    <button onclick="searchHospital()">

      Search

    </button>

  </section>

  <!-- HOSPITAL RESULTS -->

  <div
    id="hospitalResults"
    class="cards">

  </div>

  <!-- MEDICINE -->

  <section style="text-align:center;padding:40px;">

    <h2 style="color:#2563eb;">

      💊 Medicine Availability

    </h2>

    <input
      type="text"
      id="medicineInput"
      placeholder="Enter Medicine Name">

    <button onclick="checkMedicine()">

      Check Medicine

    </button>

    <p
      id="medicineResult"
      style="margin-top:20px;
      color:green;
      font-size:20px;">

    </p>

  </section>

  <!-- EMERGENCY -->

  <section class="emergency">

    <h2>
      🚑 Emergency Support
    </h2>

    <button onclick="callAmbulance()">

      Ambulance

    </button>

    <button onclick="callEmergency()">

      Emergency

    </button>

  </section>

  <footer>

    <h2>
      Affordable Healthcare Finder
    </h2>

    <p>
      Affordable healthcare for everyone 🌍
    </p>

  </footer>

    ];

    function displayHospitals(data){

      const container =
        document.getElementById(
          "hospitalResults"
        );

      container.innerHTML = "";

      data.forEach(hospital => {

        container.innerHTML += `

          <div class="card">

            <h3>
              ${hospital.name}
            </h3>

            <p>
              📍 ${hospital.city}
            </p>

            <p>
              ⭐ Rating:
              ${hospital.rating}
            </p>

            <p>
              💰 Consultation:
              ${hospital.consultation}
            </p>

            <p>
              🧪 CT Scan:
              ${hospital.ctScan}
            </p>

            <p>
              🧠 MRI:
              ${hospital.mri}
            </p>

            <p>
              🚑 Emergency:
              ${hospital.emergency}
            </p>

            <div style="margin-top:15px;">

              <button onclick="openMap('${hospital.name}')">

                Open Map

              </button>

              <button onclick="callHospital('${hospital.phone}')">

                Call

              </button>

              <button onclick="bookAppointment('${hospital.name}')">

                Appointment

              </button>

            </div>

          </div>

        `;

      });

    }

    displayHospitals(hospitals);

    function searchHospital(){

      const search =
        document.getElementById(
          "hospitalSearch"
        ).value.toLowerCase();

      const filtered =
        hospitals.filter(hospital =>

          hospital.name
          .toLowerCase()
          .includes(search)

        );

      if(filtered.length === 0){

        alert(
          "No hospitals found"
        );

      }

      displayHospitals(filtered);

    }

    function findNearbyHospitals(){

      if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(

          function(){

            alert(
              "📍 Nearby Ballari hospitals loaded successfully"
            );

            displayHospitals(hospitals);

          },

          function(){

            alert(
              "Please allow location access"
            );

          }

        );

      }

    }

    function openMap(hospitalName){

      window.open(

        `https://www.google.com/maps/search/${hospitalName}+Ballari`,

        "_blank"

      );

    }

    function callHospital(phone){

      window.location.href =
        "tel:" + phone;

    }

    function voiceSupport(){

      const speech =
        new SpeechSynthesisUtterance(

          "Welcome to Affordable Healthcare Finder. " +

          "This application helps users find nearby hospitals in Ballari, " +

          "view consultation fees, CT scan prices, MRI prices, " +

          "emergency support and map navigation."

        );

      speech.lang = "en-US";

      window.speechSynthesis.speak(speech);

    }

    function checkMedicine(){

      const medicine =
        document.getElementById(
          "medicineInput"
        ).value;

      document.getElementById(
        "medicineResult"
      ).innerHTML =

        "✅ " +
        medicine +
        " is available nearby.";

    }

    function bookAppointment(hospital){

      const confirmBooking =
        confirm(

          "Do you want to book appointment at " +
          hospital + " ?"

        );

      if(confirmBooking){

        alert(
          "✅ Appointment booked successfully"
        );

      }

    }

    function callAmbulance(){

      window.location.href =
        "tel:108";

    }

    function callEmergency(){

      window.location.href =
        "tel:102";

    }

</html>
