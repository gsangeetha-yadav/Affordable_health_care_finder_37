<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    Affordable Healthcare Finder
  </title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:linear-gradient(to right,#dbeafe,#ffffff,#dcfce7);
    }

    nav{
      background:white;
      padding:20px;
      text-align:center;
      box-shadow:0 2px 10px gray;
    }

    nav h1{
      color:#2563eb;
    }

    .hero{
      text-align:center;
      padding:50px 20px;
    }

    .hero h2{
      color:#2563eb;
      font-size:45px;
    }

    .hero p{
      margin-top:15px;
      color:gray;
      font-size:20px;
    }

    input,select{
      width:320px;
      padding:12px;
      border-radius:10px;
      border:1px solid gray;
      margin-top:15px;
    }

    button{
      padding:12px 20px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      margin:10px;
      font-size:15px;
    }

    button:hover{
      background:#1d4ed8;
    }

    .cards{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:20px;
      padding:30px;
    }

    .card{
      width:400px;
      background:white;
      padding:20px;
      border-radius:20px;
      box-shadow:0 5px 10px gray;
    }

    .card h3{
      color:green;
      margin-bottom:10px;
    }

    .card p{
      margin-top:8px;
      line-height:1.6;
    }

    ul{
      margin-left:20px;
      margin-top:10px;
    }

    li{
      margin-top:5px;
    }

    footer{
      background:#2563eb;
      color:white;
      text-align:center;
      padding:20px;
      margin-top:40px;
    }

    #hospitalResults{
      display:none;
    }

  </style>

</head>

<body>

  <nav>

    <h1>
      🏥 Affordable Healthcare Finder
    </h1>

  </nav>

  <section class="hero">

    <h2>
      Affordable Healthcare Finder 🩺
    </h2>

    <p>
      Search Hospital Name or Treatment
    </p>

    <select id="language">

      <option value="en-US">
        English
      </option>

      <option value="kn-IN">
        Kannada
      </option>

      <option value="hi-IN">
        Hindi
      </option>

      <option value="te-IN">
        Telugu
      </option>

    </select>

    <br>

    <button onclick="voiceSupport()">

      🎤 Start Voice Guidance

    </button>

    <button onclick="stopVoice()">

      ⛔ Stop Voice Guidance

    </button>

    <br>

    <input
      type="text"
      id="hospitalSearch"
      placeholder="Search Hospital or Treatment">

    <button onclick="searchHospital()">

      🔍 Search

    </button>

  </section>

  <!-- RESULTS -->

  <div
    id="hospitalResults"
    class="cards">

  </div>

  <footer>

    <h2>
      Affordable Healthcare Finder
    </h2>

    <p>
      Affordable healthcare for everyone 🌍
    </p>

  </footer>

  <script>

    let speech;

    const hospitals = [

      {

        name:
          "S. R. Multi Speciality Hospital",

        city:
          "Ballari",

        rating:
          "4.1",

        consultation:
          "₹300–₹700",

        treatments:[

          "CBC Blood Test - ₹450",
          "X-Ray - ₹800",
          "Ultrasound - ₹2000",
          "CT Scan - ₹5000–₹8000",
          "MRI Scan - ₹6000–₹15000",
          "ICU Per Day - ₹10000+",
          "Normal Delivery - ₹40000+",
          "C-Section - ₹75000+"

        ],

        phone:
          "08392256500"

      },

      {

        name:
          "Shree Navodaya Multi Speciality Hospital",

        city:
          "Ballari",

        rating:
          "3.4",

        consultation:
          "₹250–₹500",

        treatments:[

          "Blood Tests - ₹300–₹1200",
          "ECG - ₹500",
          "X-Ray - ₹700",
          "Ultrasound - ₹1800",
          "CT Scan - ₹4500–₹7000",
          "MRI Scan - ₹5500–₹12000",
          "ICU Per Day - ₹8000+"

        ],

        phone:
          "08579897989"

      },

      {

        name:
          "VOISE Multi-Speciality Hospital and Research Center",

        city:
          "Ballari",

        rating:
          "3.3",

        consultation:
          "₹300–₹600",

        treatments:[

          "CBC Test - ₹450",
          "ECG - ₹500",
          "X-Ray - ₹800",
          "CT Scan - ₹5000–₹9000",
          "MRI Scan - ₹6500–₹16000",
          "Dialysis - ₹2500",
          "ICU Per Day - ₹10000–₹18000"

        ],

        phone:
          "08392258888"

      },

      {

        name:
          "BALLARI Health City",

        city:
          "Ballari",

        rating:
          "3.3",

        consultation:
          "₹400–₹800",

        treatments:[

          "Blood Tests - ₹500–₹2000",
          "X-Ray - ₹1000",
          "Ultrasound - ₹2500",
          "CT Scan - ₹6000–₹10000",
          "MRI Scan - ₹7000–₹18000",
          "Angiography - ₹25000+",
          "ICU Per Day - ₹12000–₹25000"

        ],

        phone:
          "8884489777"

      },

      {

        name:
          "Danamma Super Speciality Hospital",

        city:
          "Ballari",

        rating:
          "4.0",

        consultation:
          "₹300–₹700",

        treatments:[

          "Blood Tests - ₹400–₹1500",
          "ECG - ₹500",
          "Ultrasound - ₹2000",
          "CT Scan - ₹5000–₹9000",
          "MRI Scan - ₹6000–₹14000",
          "Delivery Package - ₹40000–₹90000"

        ],

        phone:
          "08392250000"

      },

      {

        name:
          "B K S Hospital",

        city:
          "Ballari",

        rating:
          "4.4",

        consultation:
          "₹400–₹800",

        treatments:[

          "CBC Test - ₹450",
          "ECG - ₹600",
          "X-Ray - ₹900",
          "Ultrasound - ₹2500",
          "CT Scan - ₹6000–₹10000",
          "MRI Scan - ₹7000–₹18000",
          "Delivery Package - ₹50000–₹1 lakh"

        ],

        phone:
          "08392256500"

      }

    ];

    function searchHospital(){

      const search =
        document.getElementById(
          "hospitalSearch"
        ).value.toLowerCase();

      const container =
        document.getElementById(
          "hospitalResults"
        );

      container.style.display = "flex";

      container.innerHTML = "";

      if(search === ""){

        alert(
          "Please enter hospital or treatment"
        );

        container.style.display = "none";

        return;

      }

      const filtered =
        hospitals.filter(hospital =>

          hospital.name
          .toLowerCase()
          .includes(search)

          ||

          hospital.treatments.some(

            treatment =>

            treatment
            .toLowerCase()
            .includes(search)

          )

        );

      if(filtered.length === 0){

        container.innerHTML =

          "<h2>No Hospitals Found</h2>";

        return;

      }

      filtered.forEach(hospital => {

        let treatmentList = "";

        hospital.treatments.forEach(item => {

          treatmentList +=
            `<li>${item}</li>`;

        });

        container.innerHTML += `

          <div class="card">

            <h3>

              ${hospital.name}

            </h3>

            <p>

              📍 ${hospital.city}

            </p>

            <p>

              ⭐ Rating:
              ${hospital.rating}

            </p>

            <p>

              💰 Consultation:
              ${hospital.consultation}

            </p>

            <p>

              🩺 Treatments & Costs:

            </p>

            <ul>

              ${treatmentList}

            </ul>

            <button onclick="openMap('${hospital.name}')">

              📍 Open Map

            </button>

            <button onclick="callHospital('${hospital.phone}')">

              📞 Call

            </button>

            <button onclick="bookAppointment('${hospital.name}')">

              📅 Appointment

            </button>

          </div>

        `;

      });

    }

    function openMap(hospitalName){

      window.open(

        `https://www.google.com/maps/search/${hospitalName}+Ballari`,

        "_blank"

      );

    }

    function callHospital(phone){

      window.location.href =
        "tel:" + phone;

    }

    function bookAppointment(hospital){

      const confirmBooking =
        confirm(

          "Do you want to book appointment at " +
          hospital + " ?"

        );

      if(confirmBooking){

        alert(
          "✅ Appointment booked successfully"
        );

      }

    }

    function voiceSupport(){

      const language =
        document.getElementById(
          "language"
        ).value;

      speech =
        new SpeechSynthesisUtterance();

      speech.lang = language;

      if(language === "en-US"){

        speech.text =

          "Welcome to Affordable Healthcare Finder. " +

          "To use this application, first select your language. " +

          "Then type hospital name or treatment name in the search box. " +

          "Click search button to view hospitals, treatments and costs. " +

          "Use open map button for hospital location. " +

          "Use call button to contact hospital. " +

          "Use appointment button for booking appointments.";

      }

      else if(language === "kn-IN"){

        speech.text =

          "ಅಫೋರ್ಡಬಲ್ ಹೆಲ್ತ್ ಕೇರ್ ಫೈಂಡರ್ ಗೆ ಸ್ವಾಗತ. " +

          "ಮೊದಲು ಭಾಷೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ. " +

          "ಆಸ್ಪತ್ರೆ ಅಥವಾ ಚಿಕಿತ್ಸೆಯ ಹೆಸರನ್ನು ಹುಡುಕಿ. " +

          "ಸರ್ಚ್ ಬಟನ್ ಒತ್ತಿ ಆಸ್ಪತ್ರೆ ಮತ್ತು ಚಿಕಿತ್ಸೆಯ ವಿವರಗಳನ್ನು ನೋಡಿ.";

      }

      else if(language === "hi-IN"){

        speech.text =

          "अफोर्डेबल हेल्थ केयर फाइंडर में आपका स्वागत है। " +

          "पहले भाषा चुनें। " +

          "फिर अस्पताल या इलाज का नाम खोजें। " +

          "सर्च बटन दबाकर अस्पताल और इलाज की जानकारी देखें।";

      }

      else if(language === "te-IN"){

        speech.text =

          "అఫోర్డబుల్ హెల్త్ కేర్ ఫైండర్ కు స్వాగతం. " +

          "ముందుగా భాషను ఎంచుకోండి. " +

          "తర్వాత హాస్పిటల్ లేదా ట్రీట్మెంట్ పేరు సెర్చ్ చేయండి. " +

          "సెర్చ్ బటన్ నొక్కి హాస్పిటల్ వివరాలు చూడండి.";

      }

      window.speechSynthesis.speak(speech);

    }

    function stopVoice(){

      window.speechSynthesis.cancel();

    }

  </script>

</body>

</html>
